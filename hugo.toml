baseURL = "https://vinayrevanuru.github.io/"
locale = "en"
defaultContentLanguage = "en"
title = "Yaniv's Blog"
theme = "PaperMod"
paginate = 5

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Yaniv's Blog"
description = "Personal blog — notes on hosting, tech, and life"
author = "Yaniv"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
defaultTheme = "auto"   # auto-switches light/dark based on reader's system
disableThemeToggle = false

[params.homeInfoParams]
Title = "Hi there 👋"
Content = "Welcome to my blog. I write about tech, hosting, and things I learn along the way."

[[params.socialIcons]]
name = "github"
url = "https://github.com/yaniv"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.highlight]
style = "dracula"
lineNos = false
codeFences = true
guessSyntax = true

[[menu.main]]
identifier = "archives"
name = "Archives"
url = "/archives/"
weight = 5

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 10

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 15

[markup.goldmark.renderer]
unsafe = true
